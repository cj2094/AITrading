[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-cta-perp"
version = "0.1.0"
description = "Trend CTA live trader for crypto USDT-M perpetual futures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crypto-cta-perp" }]
dependencies = [
  "ccxt>=4.4.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
cta-live = "cta.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
