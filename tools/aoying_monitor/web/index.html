<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>熬鹰资本 · 带单监控</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <div class="mark" aria-hidden="true"></div>
          <div>
            <p class="eyebrow">Binance Copy Trading Monitor</p>
            <h1 id="name">熬鹰资本</h1>
          </div>
        </div>
        <div class="controls">
          <label class="toggle">
            <input id="autoRefresh" type="checkbox" checked />
            <span>自动刷新</span>
          </label>
          <label class="interval">
            间隔
            <select id="intervalSec">
              <option value="10">10s</option>
              <option value="15" selected>15s</option>
              <option value="30">30s</option>
              <option value="60">60s</option>
            </select>
          </label>
          <button id="refreshBtn" type="button">立即刷新</button>
        </div>
      </header>

      <section class="meta-row">
        <div id="watcherPill" class="pill warn">Watcher · —</div>
        <div id="cachePill" class="pill">Cache · —</div>
        <div id="clockPill" class="pill">更新 · —</div>
        <a id="binanceLink" class="pill link" href="#" target="_blank" rel="noreferrer"
          >币安带单页 ↗</a
        >
      </section>

      <section class="hero-stats" id="heroStats" aria-live="polite"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>估算未平仓敞口</h2>
          <p>仓位已隐藏，以下由公开成交推算</p>
        </div>
        <div id="exposureTable" class="table-wrap"></div>
      </section>

      <section class="grid-2">
        <div class="panel">
          <div class="panel-head">
            <h2>最近订单</h2>
            <p>开 / 加 / 减 / 平</p>
          </div>
          <div id="ordersTable" class="table-wrap"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h2>最近平仓</h2>
            <p>All Closed / Closed</p>
          </div>
          <div id="closesTable" class="table-wrap"></div>
        </div>
      </section>

      <footer class="foot">
        <span id="notes"></span>
        <span id="errorBox" class="error" hidden></span>
      </footer>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
